name: Android APK

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Lu par android/app/build.gradle : versionCode = run_number, versionName = <appVersionBase>.<run_number>.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Optionnel : voir docs/NOTIFICATIONS.md pour créer ce secret une fois
      # le projet Firebase configuré. Sans lui, le build réussit quand même
      # (app/build.gradle saute le plugin google-services si le fichier est
      # absent) — seules les notifications push ne fonctionneront pas.
      - name: Config Firebase (si le secret existe)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # versionCode/versionName viennent de BUILD_NUMBER (voir android/app/build.gradle) : chaque run
      # a une version unique et strictement croissante, nécessaire à Android (versionCode) et à
      # lielugit-updater (le tag v<version> doit être supérieur à la version installée).
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep '^appVersionBase=' android/gradle.properties | cut -d= -f2)
          echo "code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -q

      # Gradle nomme toujours sa sortie "app-debug.apk" (nom fixe lié au
      # buildType), quelle que soit la version : on la renomme pour que le
      # fichier téléchargé (artifact ou asset de release) porte la version
      # au lieu d'un nom générique identique à chaque run.
      - name: Renommer l'APK avec sa version
        id: apk
        run: |
          NAME="monNhuitNe-${{ steps.version.outputs.name }}.apk"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/$NAME"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: monnhuitne-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      # Vraie release GitHub, versionnée et permanente : seulement pour main,
      # jamais écrasée (chaque run a une version unique), pas marquée
      # "Pre-release". Toujours signée avec la clé debug committée (pas de
      # clé de production configurée) : à faire évoluer le jour où on distribue
      # via le Play Store ou en dehors des testeurs internes.
      - name: Publier la release GitHub (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<EOF
          ## monNhuitNe $TAG

          Run #${{ github.run_number }} (${{ github.sha }}). Signé avec la clé debug (pas de clé de production configurée).

          ### Installation

          - **Déjà installée** : ouvrez l'app. Elle cherche une mise à jour à chaque ouverture et vous guide (Installer → autoriser l'installation d'applications inconnues si Android le demande → confirmer « Mettre à jour »). Vos données sont conservées. Vous pouvez aussi toucher « Rechercher une mise à jour » dans les Réglages.
          - **Première installation (manuelle)** : téléchargez l'APK ci-dessous sur le téléphone, ouvrez-le, autorisez la source si Android la bloque, puis touchez « Installer ». Les mises à jour suivantes sont ensuite proposées dans l'app.
          EOF
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "monNhuitNe $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      # Les artifacts d'Actions sont hébergés sur Azure Blob Storage, souvent
      # bloqué par des politiques réseau restrictives. Une release GitHub
      # (objects.githubusercontent.com) reste accessible dans ces cas et sert
      # de lien stable pour installer le dernier APK debug. Un tag par branche
      # évite qu'un build staging n'écrase le dernier build main (ou l'inverse).
      # Réservé à staging/PR/dispatch : main a sa vraie release ci-dessus.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK debug en release GitHub
        if: "!(github.event_name == 'push' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.reltag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "monNhuitNe — APK debug (${{ steps.reltag.outputs.branch }})" \
            --notes "Build automatique non signé, run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
